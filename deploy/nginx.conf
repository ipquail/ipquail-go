map $http_user_agent $ipquailindex {
	default /index.html;
	~curl /ip;
	~Python-urllib /ip;
	~OpenBSD /ip;
	~Go-http-client /ip;
}

server {
	listen 80;
	listen [::]:80;
	server_name ipquail.com 4.ipquail.com 6.ipquail.com www.ipquail.com;
	root /var/www/ipquail/public;
	charset utf-8;

	location = / { rewrite ^ $ipquailindex; }
	location / { try_files $uri $uri/ $uri.html =404; }

	location = /ip  { proxy_pass http://127.0.0.1:3000/ip;  include /etc/nginx/proxy_params; proxy_set_header X-Real-IP $remote_addr; }
	location = /ptr { proxy_pass http://127.0.0.1:3000/ptr; include /etc/nginx/proxy_params; proxy_set_header X-Real-IP $remote_addr; }
	location = /asn { proxy_pass http://127.0.0.1:3000/asn; include /etc/nginx/proxy_params; proxy_set_header X-Real-IP $remote_addr; }
	location /api/  { proxy_pass http://127.0.0.1:3000/api/; include /etc/nginx/proxy_params; proxy_set_header X-Real-IP $remote_addr; }

	location = /metrics {
		allow 127.0.0.1;
		allow ::1;
		deny all;
		proxy_pass http://127.0.0.1:3000/metrics;
		include /etc/nginx/proxy_params;
	}
	location = /health { return 404; }
}

# Add TLS certificate directives and the same locations to a separate 443
# server block when using nginx on the host. Direct HTTP remains available.
